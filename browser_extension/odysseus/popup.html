<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Odysseus</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header>
        <div class="brand" aria-label="Odysseus">
          <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
            <path d="M16 4L16 22L6 22Z" fill="currentColor"/>
            <path d="M16 8L16 22L24 22Z" fill="currentColor" opacity="0.62"/>
            <path d="M4 24Q10 20 16 24Q22 28 28 24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>
          <h1>Odysseus</h1>
        </div>
        <button id="test" type="button">Test</button>
      </header>

      <label>
        <span>Server</span>
        <input id="baseUrl" type="url" placeholder="https://odysseus.example.com">
      </label>

      <label>
        <span>Browser token</span>
        <input id="token" type="password" placeholder="ody_...">
      </label>

      <section class="toggles">
        <label class="check">
          <input id="pageSummary" type="checkbox">
          <span>Page summaries</span>
        </label>
        <label class="check">
          <input id="screenshots" type="checkbox">
          <span>Screenshots</span>
        </label>
      </section>

      <label>
        <span>Instruction</span>
        <textarea id="instruction" rows="2" placeholder="Summarize the page for me."></textarea>
      </label>

      <label>
        <span>Destination chat</span>
        <select id="targetSession">
          <option value="">New browser summary chat</option>
        </select>
      </label>

      <div class="actions">
        <button id="save" type="button">Save</button>
        <button id="summarize" type="button">Summarize</button>
        <button id="screenshot" type="button">Screenshot</button>
      </div>

      <pre id="status" aria-live="polite"></pre>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
